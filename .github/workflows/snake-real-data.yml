name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # දවසකට එක සැරයක් auto-update (UTC 00:00) - ඔබේ real contributions වලින්ම
  workflow_dispatch:        # Actions tab එකෙන් manually run කරන්නත් පුළුවන්
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          # github.repository_owner කියන්නේ මේ repo එකේ owner - ඔබේ real username එකම auto-detect වෙනවා
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c026e0&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23c026e0

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
