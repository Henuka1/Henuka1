name: Generate Streak Stats

on:
  schedule:
    - cron: "17 3 * * *"   # UTC 3:17 AM - busy 00:00 slot එකෙන් ඉවත් කරලා, rate-limit congestion එක අඩු කරන්න
  workflow_dispatch:        # Actions tab එකෙන් manually run කරන්නත් පුළුවන්

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate Streak Stats
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: ${{ secrets.USER_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: tokyonight
          OUTPUT_PATH: github-streak-stats.svg
        continue-on-error: true
        id: streak_attempt1

      - name: Retry once if first attempt failed
        if: steps.streak_attempt1.outcome == 'failure'
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: ${{ secrets.USER_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: tokyonight
          OUTPUT_PATH: github-streak-stats.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: .
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
